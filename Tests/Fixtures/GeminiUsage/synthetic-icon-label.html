<!doctype html>
<!-- Hand-written variant: a row label shares its element with an icon, and
     the page has a main element around the content. -->
<html lang="en">
<body>
  <aside><span>Current usage</span><span>55%</span></aside>
  <main>
    <section>
      <h1 role="heading">Usage limits <span>ULTRA</span></h1>
      <div class="card"><h3>Current usage <mat-icon aria-hidden="true">info</mat-icon></h3>
        <span>12% used</span><span>Resets at 6:18 AM</span></div>
      <div class="card"><h3>Weekly limit</h3><span>30% used</span></div>
    </section>
  </main>
</body>
</html>
