<!doctype html>
<!-- claude.ai Usage page in Chinese (zh-Hans) as of 2026-11-08. Structure follows the live page, which matches the
     English redesign: both quota rows share one section, the weekly label is the text of a toggle button beside an
     icon-font glyph, meters carry aria-valuenow, resets are plain text such as "星期六06:00 重置". Every value is
     synthetic; no account data. -->
<html lang="zh-Hans"><body><main>
  <section>
    <div>
      <div><h3>进度正常。在星期六重置前，您的额度应该还很充裕。</h3></div>
      <div><div>
        <div>
          <div>
            <span><span>当前会话</span></span>
            <span>周二18:40 重置</span>
          </div>
          <div>
            <div><div><div role="meter" aria-labelledby="m1" aria-valuenow="8" aria-valuemin="0" aria-valuemax="100"><div></div></div></div></div>
            <span id="m1">已使用 8%</span>
          </div>
        </div>
        <div data-testid="pace-week" data-state="closed">
          <div>
            <div>
              <span><span><button type="button" aria-expanded="false" data-testid="pace-week-toggle">本周<span data-cds="Icon" aria-hidden="true">&#xE027;</span></button></span></span>
              <span>星期六09:00 重置</span>
            </div>
          </div>
          <div>
            <div><div><div><div role="meter" aria-labelledby="m2" aria-valuenow="14" aria-valuemin="0" aria-valuemax="100"><div></div></div></div></div></div>
            <span id="m2">已使用 14%</span>
          </div>
        </div>
      </div></div>
    </div>
  </section>
  <section><h3>限额重置</h3><p>暂无重置</p></section>
  <section><h3>用量额度</h3><p>可用于任何任务。</p><span>$5</span></section>
  <section>
    <h3>本周各产品的用量</h3>
    <div><span>Claude Code</span><div role="meter" aria-labelledby="p1" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100"></div><span id="p1">90%</span></div>
    <div><span>对话</span><div role="meter" aria-labelledby="p2" aria-valuenow="6" aria-valuemin="0" aria-valuemax="100"></div><span id="p2">6%</span></div>
    <div><span>其他</span><div role="meter" aria-labelledby="p3" aria-valuenow="1" aria-valuemin="0" aria-valuemax="100"></div><span id="p3">1%</span></div>
  </section>
</main></body></html>
